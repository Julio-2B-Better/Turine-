<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; connect-src 'self' https://ehtykejbsikpbnkrkgsm.supabase.co https://*.supabase.co; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://www.w3schools.com;">
    <title>Criar Conta - TuriNE</title>
    <link rel="stylesheet" href="https://www.w3schools.com/w3css/4/w3.css" />
    <link rel="stylesheet" href="cadastro.css" />
</head>

<body>
<header class="topo">
    <div class="area-logo">
        <a href="/Tela_1/pagina_inicial.html">
            <img src="/Imagem_site/turine_logo.png" width="46" height="48">
        </a>
        <span class="marca">Turi-NE</span>
    </div>
</header>

<form id="meuFormCadastro" class="card">

    <h1>Cadastrar Usuário</h1>
    <p class="sub">Insira as informações solicitadas</p>

    <div class="form-grid">

        <div class="coluna">
            <div class="input-box">
                <label>Nome completo</label>
                <input type="text" id="regNome" placeholder="Nome completo" required>
            </div>

            <div class="input-box">
                <label>Nome de Usuário</label>
                <input type="text" placeholder="Nome de usuário">
            </div>

            <div class="input-box">
                <label>CPF</label>
                <input type="text" id="cpf" maxlength="14" placeholder="000.000.000-00">
            </div>

            <div class="input-box">
                <label>Data de Nascimento</label>
                <div class="data-grid">
                    <select>
                        <option>Dia</option>
                        <option>1</option><option>2</option><option>3</option>
                    </select>

                    <select>
                        <option>Mês</option>
                        <option>Janeiro</option><option>Fevereiro</option>
                    </select>

                    <select>
                        <option>Ano</option>
                        <option>2026</option>
                    </select>
                </div>
            </div>

            <div class="input-box">
                <label>Gênero</label>
                <select class="select-genero">
                    <option value="">Selecione</option>
                    <option value="feminino">Feminino</option>
                    <option value="masculino">Masculino</option>
                </select>
            </div>
        </div>

        <div class="linha"></div>

        <div class="coluna">
            <div class="input-box">
                <label>E-mail</label>
                <input type="email" id="regEmail" placeholder="Digite seu E-mail" required>
            </div>

            <div class="input-box">
                <label>Confirme seu E-mail</label>
                <input type="email" placeholder="Confirme seu E-mail">
            </div>

            <div class="input-box">
                <label>Senha</label>
                <input type="password" id="regSenha" placeholder="Digite sua senha" required>
            </div>

            <div class="input-box">
                <label>Confirme sua senha</label>
                <input type="password" placeholder="Confirme sua senha">
            </div>
        </div>

    </div>

    <p class="bemvindo">Seja bem-vindo ao Turi-NE!</p>

    <button type="submit" class="btn">Finalizar Cadastro</button>

</form>

<footer class="rodape">
    2026 - Turi-NE
</footer>

<script src="../js/database.js"></script>
<script src="../js/patterns.js"></script>
<script src="app_cadastro.js"></script>

</body>
</html>
